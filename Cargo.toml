[package]
name = "crumbkit-flightdeck"
description = "A local web page that lists, runs and draws the commands of any crumbkit tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crumbkit/flightdeck"
readme = "README.md"
keywords = ["cli", "crumbkit", "web"]
categories = ["command-line-utilities"]

# The package holds the built page in ui/dist, which the binary embeds, and
# none of the page's sources, so building the crate never runs Node.
include = [
    "/src/**",
    "/ui/dist/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[[bin]]
name = "flightdeck"
path = "src/main.rs"

[dependencies]
# flightdeck is a binary, so it chooses clap's user-facing features: help,
# usage lines, error context and suggestions for mistyped commands.
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# crumbkit parses flightdeck's own command line and mounts `commands list`,
# `schemas list` and `schemas show`. The `derive` feature writes the `Failure`
# impl of the model's load failures.
crumbkit = { version = "0.2", default-features = false, features = ["derive"] }
# serde reads the JSON documents that a crumbkit tool prints into the model's
# own types.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
# serde_json parses those documents and holds each result's JSON Schema as a
# `Value`.
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
# httparse reads the request line and headers of each request that the
# page's server receives, into a fixed number of headers, with no
# allocation of its own.
httparse = { version = "1.10.1", default-features = false }
# getrandom reads the page's launch code and token, and the runner's
# confirmation ids and trace id, from the operating system's random source.
getrandom = { version = "0.4.3", default-features = false }
# secrecy holds the launch code and the token, so their `Debug` prints a
# placeholder and their memory is zeroed when they are dropped (BASE-24). The
# `serde` feature reads the launch code that the page sends straight into a
# secret.
secrecy = { version = "0.10.3", default-features = false, features = ["serde"] }
# signal-hook sets a flag on Ctrl-C and SIGTERM, which the server's loop
# reads, so `flightdeck open` stops and removes its opener page.
signal-hook = { version = "0.4.6", default-features = false }
# humantime writes when a run started, as RFC 3339 text in UTC, on the first
# line of its stream. crumbkit already depends on it. It has no default
# features.
humantime = { version = "2.4.0", default-features = false }
# subtle compares a presented token or launch code with the real one in
# constant time.
subtle = { version = "2.6.1", default-features = false }
# tempfile creates the opener page's directory, private to the user, and
# removes it when flightdeck stops. It also makes the fresh state directory
# of the loader's description queries and of the help measurement. Each test that runs a tool also gives it
# XDG directories in a temporary directory of its own.
tempfile = { version = "3.27.0", default-features = false }
# crumbkit-process runs every child that flightdeck starts: it starts the
# child in a process group of its own on Unix or a job object on Windows,
# reads its output within limits and a deadline, stops it by escalating
# signals, and reaps it.
crumbkit-process = { version = "0.2", default-features = false }
# shlex quotes each word of a run's display line for a POSIX shell.
shlex = { version = "2.0.1", default-features = false }
# unicode-general-category tells the runner which characters are format
# characters, which a display line would not show. It has no features.
unicode-general-category = { version = "1.1.0", default-features = false }

[target.'cfg(unix)'.dependencies]
# rustix names the errors after which the server keeps accepting connections.
# Its `std` feature converts an `io::Error`, and the tests signal processes
# through `process`.
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[dev-dependencies]
# The tests of `flightdeck open` wait with a time limit for the flightdeck
# that they start. It has no features.
wait-timeout = { version = "0.2.1", default-features = false }
# The convention tests check flightdeck's command tree, tool record and codes with
# crumbkit-test.
crumbkit-test = { version = "0.2", default-features = false }
# The schema tests validate real documents against crumbkit's checked-in
# JSON Schemas, which use draft 2020-12.
jsonschema = { version = "0.60.2", default-features = false }

[workspace]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"                 # BASE-3
unreachable_pub = "warn"               # BASE-8
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "deny"                # BASE-2
allow_attributes_without_reason = "deny" # BASE-2
unwrap_used = "deny"                     # BASE-4
expect_used = "deny"                     # BASE-4
panic = "deny"                           # BASE-4
todo = "deny"                            # BASE-4
unimplemented = "deny"                   # BASE-4
dbg_macro = "deny"                       # BASE-4
unreachable = "deny"                     # BASE-4
indexing_slicing = "deny"                # BASE-4
cast_possible_truncation = "deny"        # BASE-12
cast_sign_loss = "deny"                  # BASE-12
cast_possible_wrap = "deny"              # BASE-12
cast_precision_loss = "deny"             # BASE-12
cast_lossless = "deny"                   # BASE-12
disallowed_methods = "deny"              # BASE-5, BASE-6, BASE-7, BASE-11
disallowed_types = "deny"                # BASE-5
disallowed_macros = "deny"               # BASE-7
print_stdout = "deny"                    # BASE-5
print_stderr = "deny"                    # BASE-5
mod_module_files = "deny"                # BASE-9
too_many_lines = "deny"                  # BASE-10
wildcard_imports = "deny"                # BASE-13
enum_glob_use = "deny"                   # BASE-13
ref_option = "deny"                      # BASE-14
needless_for_each = "deny"               # BASE-15
fn_params_excessive_bools = "deny"       # BASE-16

[lints]
workspace = true

# BASE-27: overflow checks stay on in release builds, and panics unwind.
# rust-standards.toml records the other settings as the `release-profile`
# decision.
[profile.release]
overflow-checks = true
lto = false
codegen-units = 16
strip = "none"

[package]
name = "crumbkit-flightdeck"
description = "A local web page that lists, runs and draws the commands of any crumbkit tool"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crumbkit/flightdeck"
readme = "README.md"
keywords = ["cli", "crumbkit", "web"]
categories = ["command-line-utilities"]

[[bin]]
name = "flightdeck"
path = "src/main.rs"

[dependencies]
# flightdeck is a binary, so it chooses clap's user-facing features: help,
# usage lines, error context and suggestions for mistyped commands.
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# crumbkit parses flightdeck's own command line and mounts `commands list`,
# `schemas list` and `schemas show`.
crumbkit = { version = "0.1.0", default-features = false }
# wait-timeout waits for a child process with a time limit, so a tool that
# never exits is stopped. It has no features.
wait-timeout = { version = "0.2.1", default-features = false }

[target.'cfg(unix)'.dependencies]
# rustix stops every process in the child's process group when the time limit
# passes, through a safe function, so a descendant that holds the child's
# output open is stopped too.
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[dev-dependencies]
# The convention tests check flightdeck's command tree, guide and codes with
# crumbkit-test.
crumbkit-test = { version = "0.1.0", default-features = false }

[workspace]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"                 # BASE-3
unreachable_pub = "warn"               # BASE-8
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "deny"                # BASE-2
allow_attributes_without_reason = "deny" # BASE-2
unwrap_used = "deny"                     # BASE-4
expect_used = "deny"                     # BASE-4
panic = "deny"                           # BASE-4
todo = "deny"                            # BASE-4
unimplemented = "deny"                   # BASE-4
dbg_macro = "deny"                       # BASE-4
unreachable = "deny"                     # BASE-4
indexing_slicing = "deny"                # BASE-4
cast_possible_truncation = "deny"        # BASE-12
cast_sign_loss = "deny"                  # BASE-12
cast_possible_wrap = "deny"              # BASE-12
cast_precision_loss = "deny"             # BASE-12
cast_lossless = "deny"                   # BASE-12
disallowed_methods = "deny"              # BASE-5, BASE-6, BASE-7, BASE-11
disallowed_types = "deny"                # BASE-5
disallowed_macros = "deny"               # BASE-7
print_stdout = "deny"                    # BASE-5
print_stderr = "deny"                    # BASE-5
mod_module_files = "deny"                # BASE-9
too_many_lines = "deny"                  # BASE-10
wildcard_imports = "deny"                # BASE-13
enum_glob_use = "deny"                   # BASE-13
ref_option = "deny"                      # BASE-14
needless_for_each = "deny"               # BASE-15
fn_params_excessive_bools = "deny"       # BASE-16

[lints]
workspace = true

# BASE-27: overflow checks stay on in release builds, and panics unwind.
# rust-standards.toml records the other settings as the `release-profile`
# decision.
[profile.release]
overflow-checks = true
lto = false
codegen-units = 16
strip = "none"

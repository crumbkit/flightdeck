# pnpm reads its settings from this file. The workspace's root is the page,
# which the flightdeck binary embeds from dist/. headless holds the
# compliance pages' state with no DOM and no look, and react holds the
# React hooks over it, so another front end can render the pages.
packages:
  - headless
  - react

# `pnpm add` writes an exact version, never a range (BASE-13).
savePrefix: ""
# A release becomes installable only once it is 7 days old (10,080 minutes),
# the same cooldown Dependabot applies, so a release withdrawn soon after
# publication is never installed (BASE-14).
minimumReleaseAge: 10080
# No dependency runs an install script unless it is listed here (BASE-14).
allowBuilds: {}

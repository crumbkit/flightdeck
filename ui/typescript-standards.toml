# flightdeck's adoption map of Luke Randall's TypeScript standards
# (https://github.com/crumbkit/typescript-standards, adoption.md), for the
# page in ui/, which the flightdeck binary embeds and serves.

schema = "typescript-standards/adoption/v1"
standards = { version = "0.1.0", commit = "0531f36f78463deb184952832fc387a3dd5e6ed9" }

profiles = ["base", "app", "embedded"]

[[binding]]
rule = "BASE-7"
owners = ["src/api/client.ts", "src/storage.ts", "src/clock.ts"]
checks = [
  "Biome noRestrictedGlobals, with the baseline's override for src/api/client.ts",
  "a biome-ignore comment on each storage call in src/storage.ts",
]
note = "client.ts is the only caller of fetch. storage.ts is the storage owner: it keeps the session's token in sessionStorage and the theme choice in localStorage, and nothing else touches storage. clock.ts is the clock's owner: it reads the time for a running card's elapsed time, runs the timers that tick it and sample the card's live region, and queues a stream's events for the next animation frame. A run's start time and duration come from the server."

[[binding]]
rule = "EMB-5"
owners = ["dist/", "../src/server/assets.rs"]
checks = ["every_built_file_of_the_page_is_served_with_its_bytes_and_its_media_type in ../tests/server.rs"]
note = "src/server/assets.rs embeds each file of ui/dist with include_bytes!, under the fixed names that the build writes. The test requests every file in ui/dist from the running server and checks its status, its media type and its bytes."

[[decision]]
id = "lanes"
requirement = """
- Lane: `page` in ../.github/workflows/ci.yml, on each pull request and each push to main, on ubuntu-24.04. It runs every step of the pull-request lane from `install` on, in ui/. Before `acceptance` it builds flightdeck and installs shelf and reading, which the acceptance tests start. The `workflows` step is the Rust lane's, in the `lane` job, which checks the same files. Its budget is twenty minutes, the job's timeout. The `gate` job, which the ruleset requires, passes only when `page` succeeded, so a merge waits for it.
- Lane: `advisories` in ../.github/workflows/ci.yml, daily at 06:43 UTC and on each push to main, runs `pnpm audit` in ui/ after the Rust advisories. Nothing waits for it.
"""
reason = "The page's lane runs in a job of its own beside the shared Rust lane, and the one required check, `gate`, covers both. flightdeck has no release yet, so an advisory found after merge only means a pull request that moves the affected pin."
realizations = ["../.github/workflows/ci.yml"]

[[decision]]
id = "budgets"
requirement = "The first load, index.html with assets/app.js, assets/shared.js, assets/rolldown-runtime.js, assets/index.css and the font files in fonts/, stays under 246 kB with Brotli. Every built file together stays under 264 kB."
reason = "The first load holds React, TanStack Query, zod, the commands view and its four font files, which the page draws its first screen with. The Usage view, its Weight and Both tabs, the help measurement they share, the Environment view and the workspaces pages each load in a file of their own the first time they open, so they count only toward the every-file budget. On 17 November 2026 the first load was 245.5 kB, after the Environment view's failure-card link and the model's schema of a variable raised the limit from 245 kB to 246 kB, which the maintainer approved on 2026-11-17 (board decision /projects/flightdeck/decisions/20261117T1620Z-pr-b-labels-and-budget). The workspaces pages raised the every-file limit from 260 kB to 264 kB, within the 275 kB that the maintainer allowed for them (board answer /projects/flightdeck/answers/workspaces-ui-budget), and, with their layout in a stylesheet of their own that loads with them, left the first load at 245.95 kB and every built file together at 263.95 kB, so both budgets are effectively full. The fonts are about 111 kB of both. A change that adds to either budget is a choice: the next lazy file, such as another view, needs the every-file limit raised or something removed, and the pull request that does it says which."
realizations = ["package.json"]

[[decision]]
id = "theme"
requirement = "src/index.css holds each colour role once, as a light-dark() pair, and the root's color-scheme picks the value: the system's appearance by default, or the person's choice of System, Light or Dark, which the topbar's control writes to data-theme on the root element. Tailwind's dark: variant follows the same choice."
reason = "APP-9 places the dark values under a prefers-color-scheme query. The signed-off design has a theme control, and a forced choice would need the dark values written twice, once in the query and once under data-theme. A light-dark() pair keeps each role in one place."
realizations = ["src/index.css", "src/components/ThemeControl.tsx", "src/storage.ts"]

[[decision]]
id = "streamed-runs"
requirement = "src/routes/ToolPage.tsx calls streamRun from src/api/runs.ts for each run, and the transcript's reducer in src/lib/transcript.ts holds every run's state, including its lines. Each run has its own AbortController, which leaving the page aborts. A cancel goes through useMutation."
reason = "APP-11 has a component read server data through TanStack Query. A run is a stream of events that the page draws as they arrive, and the page holds many runs at once, each with its own lines. A mutation holds the state of one call and has no place for events that arrive before the call ends, so a mutation per run would add a second copy of each run's state beside the reducer that draws it. The reducer is the one place that holds a run."
realizations = ["src/routes/ToolPage.tsx", "src/lib/transcript.ts", "src/api/runs.ts"]

[[decision]]
id = "crumbkit-ui-git-tag"
requirement = "headless/ and react/ depend on @crumbkit/ui by its git tag, `git+https://github.com/crumbkit/crumbkit-ui.git#v0.1.0`, and pnpm-lock.yaml records the tag's commit. A new version of @crumbkit/ui arrives only in a pull request that moves the tag in both manifests and the lockfile."
reason = "@crumbkit/ui is crumbkit's own package and is not on the npm registry, so it has no exact version for BASE-13 to pin and no release age for BASE-14's cooldown to read, and Dependabot does not offer its updates. The tag plus the lockfile's commit fixes the bytes installed as an exact version would. The maintainer accepted this exception for crumbkit's own packages on 2026-11-25 (board decision /projects/flightdeck/decisions/20261125T0145Z-3ee2)."
realizations = ["headless/package.json", "react/package.json", "pnpm-lock.yaml"]

[[decision]]
id = "headless-core"
requirement = "headless/ type-checks with the es2024 lib and no runtime's types, so a module there that reaches for the document, the window, fetch or storage fails to type-check. It reads the compliance document only through the ComplianceSource the app passes in, and stores nothing. react/ renders no element and returns props for the app to spread."
reason = "The compliance pages ship headless, so another front end can render them in its own look, and Flightdeck's own pages are the first user. Keeping the DOM and the network out of the core's types holds that line with the compiler rather than review."
realizations = ["headless/tsconfig.json", "headless/src/source.ts", "react/tsconfig.json"]

# The .config/nextest.toml settings that every project starts from. A failed
# test is never retried, because a retry hides a flaky test (BASE-20). Every
# test runs after a failure, so one failure does not hide another.

[profile.default]
fail-fast = false
retries = 0
# The shared pull-request lane cannot install shelf and reading, so a plain
# run leaves out the test binaries that start them. CI's `app`, `windows` and
# `macos` jobs and the release's `tests` job install them and pass
# `--ignore-default-filter`, which runs every test.
default-filter = "not (binary(model) | binary(open) | binary(routes) | binary(runner) | binary(schemas) | binary(server))"

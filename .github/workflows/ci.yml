# flightdeck's lanes, which rust-standards.toml records as the `lanes`
# decision (BASE-25). `gate` runs the pull-request lane and is the one check
# that branch protection requires. `advisories` runs daily, and `macos` runs
# the tests on macOS once a week.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * *"
    - cron: "17 5 * * 1"

# Each job grants only the permissions it needs.
permissions: {}

# A new push cancels the run for the previous push, because the newer run
# checks the same changes and more.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Any compiler or Clippy warning fails the build (BASE-1).
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:
  gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The pull-request lane's time budget (BASE-25). A run whose test tools
    # are not cached builds shelf and reading first.
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit check reads every commit of the pull request or push.
          fetch-depth: 0
      # The commit check reads only the commits, so it runs first.
      - name: commits
        run: .github/scripts/commit-check.sh "$BASE" "$HEAD"
        env:
          COMMIT_PATTERN: ${{ secrets.COMMIT_PATTERN }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # rustup installs the version and components that rust-toolchain.toml
      # names (BASE-26).
      - run: rustup toolchain install
      # install-action runs before rust-cache, so the cache leaves out the
      # tool binaries that install-action downloads on every run.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.140,cargo-deny@0.20.2,cargo-shear@1.14.0,zizmor@1.30.1
          fallback: none
      # The steps that read only the source run first, so a pull request
      # that fails one of them fails in seconds.
      - name: format
        run: cargo fmt --check
      - name: workflows
        run: zizmor .
      # Only a run on main saves the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # shelf and reading at the commit that the install script pins. The
      # key holds the script, so moving the pin installs them again. This
      # cache's own step saves before rust-cache's, because post steps run
      # in reverse order.
      - id: test-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/test-tools
          key: test-tools-${{ runner.os }}-${{ hashFiles('scripts/install-test-tools.sh', 'rust-toolchain.toml') }}
      - name: test tools
        if: steps.test-tools.outputs.cache-hit != 'true'
        run: scripts/install-test-tools.sh
      - name: deny
        run: cargo deny --locked check bans licenses sources
      - name: shear
        run: cargo shear
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features
      - name: tests
        run: cargo nextest run --locked --workspace --all-features
      - name: doctests
        run: cargo test --locked --doc --workspace --all-features

  macos:
    if: github.event.schedule == '17 5 * * 1'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      - id: test-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/test-tools
          key: test-tools-${{ runner.os }}-${{ hashFiles('scripts/install-test-tools.sh', 'rust-toolchain.toml') }}
      - name: test tools
        if: steps.test-tools.outputs.cache-hit != 'true'
        run: scripts/install-test-tools.sh
      - name: tests
        run: cargo nextest run --locked --workspace --all-features

  advisories:
    if: github.event_name != 'pull_request' && github.event.schedule != '17 5 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: advisories
        run: cargo deny --locked check advisories

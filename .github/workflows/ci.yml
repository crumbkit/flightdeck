# flightdeck's lanes, which rust-standards.toml and ui/typescript-standards.toml
# record as their `lanes` decisions. `gate` runs the Rust pull-request lane
# and then the page's, and branch protection requires it.
# `advisories` runs daily for both, and `macos` runs the tests on macOS once
# a week.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * *"
    - cron: "17 5 * * 1"

# Each job grants only the permissions it needs.
permissions: {}

# On a pull request, a new push cancels the run for the previous push,
# because the newer run checks the same changes and more. A run on main is
# never cancelled, so every commit on main keeps its result. The event's name
# is part of the group, so a scheduled run and a push to main never share a
# group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Any compiler or Clippy warning fails the build (BASE-1).
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:
  gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The pull-request lane's time budget (BASE-25), for the Rust lane and
    # the page's together. A run whose test tools are not cached builds
    # shelf and reading first.
    timeout-minutes: 20
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the version and components that rust-toolchain.toml
      # names (BASE-26).
      - run: rustup toolchain install
      # install-action runs before rust-cache, so the cache leaves out the
      # tool binaries that install-action downloads on every run.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.140,cargo-deny@0.20.2,cargo-shear@1.14.0,zizmor@1.30.1
          fallback: none
      # The steps that read only the source run first, so a pull request
      # that fails one of them fails in seconds.
      - name: format
        run: cargo fmt --check
      - name: workflows
        run: zizmor .
      # Only a run on main saves the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # shelf and reading at the commit that the install script pins. The
      # key holds the script, so moving the pin installs them again. This
      # cache's own step saves before rust-cache's, because post steps run
      # in reverse order.
      - id: test-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/test-tools
          key: test-tools-${{ runner.os }}-${{ hashFiles('scripts/install-test-tools.sh', 'rust-toolchain.toml') }}
      - name: test tools
        if: steps.test-tools.outputs.cache-hit != 'true'
        run: scripts/install-test-tools.sh
      - name: deny
        run: cargo deny --locked check bans licenses sources
      - name: shear
        run: cargo shear
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features
      - name: tests
        run: cargo nextest run --locked --workspace --all-features
      - name: doctests
        run: cargo test --locked --doc --workspace --all-features
      # The page's lane runs in ui/ (BASE-16 of the TypeScript standards).
      # pnpm/action-setup installs the pnpm that `packageManager` names, and
      # setup-node the Node that .node-version names. setup-node caches
      # pnpm's store, keyed by the lockfile.
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: lint
        run: pnpm run lint
        working-directory: ui
      - name: typecheck
        run: pnpm run typecheck
        working-directory: ui
      - name: knip
        run: pnpm run knip
        working-directory: ui
      - name: test
        run: pnpm run test
        working-directory: ui
      - name: build
        run: pnpm run build
        working-directory: ui
      # The committed bundle matches its source (EMB-1).
      - name: bundle
        run: pnpm run bundle
        working-directory: ui
      - name: size
        run: pnpm run size
        working-directory: ui
      # The browsers are cached by Playwright's version, which the lockfile
      # fixes. The system libraries they need are installed on every run.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
        working-directory: ui
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - name: acceptance
        run: pnpm run acceptance
        working-directory: ui
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: ui/test-results/
          retention-days: 7

  macos:
    if: github.event.schedule == '17 5 * * 1'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      - id: test-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/test-tools
          key: test-tools-${{ runner.os }}-${{ hashFiles('scripts/install-test-tools.sh', 'rust-toolchain.toml') }}
      - name: test tools
        if: steps.test-tools.outputs.cache-hit != 'true'
        run: scripts/install-test-tools.sh
      - name: tests
        run: cargo nextest run --locked --workspace --all-features

  advisories:
    if: github.event_name != 'pull_request' && github.event.schedule != '17 5 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: advisories
        run: cargo deny --locked check advisories
      # pnpm audit reads ui's lockfile and asks the npm registry for
      # advisories against every package in it.
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
      - name: page advisories
        working-directory: ui
        run: pnpm audit

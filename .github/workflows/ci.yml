# flightdeck's lanes, which rust-standards.toml and ui/typescript-standards.toml
# record as their `lanes` decisions. `lane` runs the shared Rust pull-request
# lane, `app` runs the environment check and every test with shelf and
# reading, and `page` runs the page's lane. `gate` passes when all three pass,
# and the ruleset requires it.
# `windows` builds and tests flightdeck on Windows for each pull request,
# `advisories` runs daily for both, and `macos` runs the tests on macOS once
# a week.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * *"
    - cron: "17 5 * * 1"

# Each job grants only the permissions it needs.
permissions: {}

# On a pull request, a new push cancels the run for the previous push,
# because the newer run checks the same changes and more. A run on main is
# never cancelled, so every commit on main keeps its result. The event's name
# is part of the group, so a scheduled run and a push to main never share a
# group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Any compiler or Clippy warning fails the build (BASE-1).
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:
  # The shared pull-request lane (BASE-25) from crumbkit/rust-standards, at
  # the commit that rust-standards.toml's `lane-commit` decision names. Its
  # check is `lane / lane`. Its tests leave out the binaries that need shelf
  # and reading, through `default-filter` in .config/nextest.toml, because the
  # shared lane cannot install them. flightdeck is not a library, so the lane
  # leaves out `rustdoc` and `features`.
  lane:
    if: github.event_name != 'schedule'
    permissions:
      contents: read # The lane's actions/checkout reads the repository.
    uses: crumbkit/rust-standards/.github/workflows/rust-lane.yml@5ba71ff31c5f5d8e69b34d04bb65bd0177f7ebeb
    with:
      library: false
      # The pull-request lane's time budget (BASE-25).
      timeout-minutes: 20

  # The steps that the shared lane cannot run: the environment check, and
  # every test with shelf and reading installed.
  app:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the version and components that rust-toolchain.toml
      # names (BASE-26).
      - run: rustup toolchain install
      # install-action runs before rust-cache, so the cache leaves out the
      # tool binaries that install-action downloads on every run.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      # starmap check fails when src reads a variable that starmap.toml does
      # not declare, or when clippy.toml lacks the disallowed readers
      # (BASE-28). The release archive is pinned by its SHA-256.
      - name: environment
        env:
          ARCHIVE: starmap-0.4.2-x86_64-unknown-linux-musl
          SHA256: ac31b39af8b294c7c87308b52e4ab7be27b14fc24b982a526682f26bb65b0ba9
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/starmap.tar.gz" \
            "https://github.com/crumbkit/starmap/releases/download/v0.4.2/$ARCHIVE.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/starmap.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/starmap.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$ARCHIVE/starmap" check
      # Only a run on main saves the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # shelf and reading at the commit that the install script pins. The
      # key holds the script, so moving the pin installs them again. This
      # cache's own step saves before rust-cache's, because post steps run
      # in reverse order.
      - id: test-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/test-tools
          key: test-tools-${{ runner.os }}-${{ hashFiles('scripts/install-test-tools.sh', 'rust-toolchain.toml') }}
      - name: test tools
        if: steps.test-tools.outputs.cache-hit != 'true'
        run: scripts/install-test-tools.sh
      # Every test, including the binaries that `default-filter` leaves out.
      - name: tests
        run: cargo nextest run --locked --workspace --all-features --ignore-default-filter

  # The page's lane in ui/ (BASE-16 of the TypeScript standards). The
  # `workflows` step is the shared lane's, which checks the same files. The
  # acceptance tests start target/debug/flightdeck with shelf and reading, so
  # the job builds flightdeck and installs the test tools first.
  page:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Only a run on main saves the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: test-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/test-tools
          key: test-tools-${{ runner.os }}-${{ hashFiles('scripts/install-test-tools.sh', 'rust-toolchain.toml') }}
      - name: test tools
        if: steps.test-tools.outputs.cache-hit != 'true'
        run: scripts/install-test-tools.sh
      # pnpm/action-setup installs the pnpm that `packageManager` names, and
      # setup-node the Node that .node-version names. setup-node caches
      # pnpm's store, keyed by the lockfile.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: lint
        run: pnpm run lint
        working-directory: ui
      - name: typecheck
        run: pnpm run typecheck
        working-directory: ui
      - name: knip
        run: pnpm run knip
        working-directory: ui
      - name: test
        run: pnpm run test
        working-directory: ui
      - name: build
        run: pnpm run build
        working-directory: ui
      # The committed bundle matches its source (EMB-1).
      - name: bundle
        run: pnpm run bundle
        working-directory: ui
      - name: size
        run: pnpm run size
        working-directory: ui
      # The acceptance tests start target/debug/flightdeck, which embeds the
      # committed bundle.
      - name: flightdeck
        run: cargo build --locked
      # The browsers are cached by Playwright's version, which the lockfile
      # fixes. The system libraries they need are installed on every run.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
        working-directory: ui
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - name: acceptance
        run: pnpm run acceptance
        working-directory: ui
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: ui/test-results/
          retention-days: 7

  # The check that the ruleset requires, until it requires `lane / lane`,
  # `app` and `page` instead. It fails unless all three succeeded, so a
  # skipped or cancelled job fails it too.
  gate:
    if: always() && github.event_name != 'schedule'
    needs: [lane, app, page]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: gate
        env:
          LANE: ${{ needs.lane.result }}
          APP: ${{ needs.app.result }}
          PAGE: ${{ needs.page.result }}
        run: |
          echo "lane: $LANE, app: $APP, page: $PAGE"
          test "$LANE" = success && test "$APP" = success && test "$PAGE" = success

  # The tests on Windows, where crumbkit-process runs a tool in a job object.
  # The tests that run a fake tool written as a shell script, or that signal
  # a process, run on Unix alone.
  windows:
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read # actions/checkout reads the repository.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: test-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/test-tools
          key: test-tools-${{ runner.os }}-${{ hashFiles('scripts/install-test-tools.sh', 'rust-toolchain.toml') }}
      - name: test tools
        if: steps.test-tools.outputs.cache-hit != 'true'
        run: scripts/install-test-tools.sh
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features
      - name: tests
        run: cargo nextest run --locked --workspace --all-features --ignore-default-filter

  macos:
    if: github.event.schedule == '17 5 * * 1'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      - id: test-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/test-tools
          key: test-tools-${{ runner.os }}-${{ hashFiles('scripts/install-test-tools.sh', 'rust-toolchain.toml') }}
      - name: test tools
        if: steps.test-tools.outputs.cache-hit != 'true'
        run: scripts/install-test-tools.sh
      - name: tests
        run: cargo nextest run --locked --workspace --all-features --ignore-default-filter

  advisories:
    if: github.event_name != 'pull_request' && github.event.schedule != '17 5 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: advisories
        run: cargo deny --locked check advisories
      # pnpm audit reads ui's lockfile and asks the npm registry for
      # advisories against every package in it.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
      - name: page advisories
        working-directory: ui
        run: pnpm audit

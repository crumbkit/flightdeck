# The release. It runs the tests on Linux, macOS and Windows and the
# advisory checks of the Rust crates and of ui/'s npm packages, builds `flightdeck` for macOS, Linux and Windows, checks
# that each binary prints the release's version, and attaches the archives to
# a GitHub release with SHA256SUMS, each with a build provenance attestation.
# It also packs @crumbkit/flightdeck-headless and @crumbkit/flightdeck-react
# at that version and checks that they install.
#
# A push of the tag `v<version>` releases that tag, where <version> is the
# version in Cargo.toml. A manual run with a tag releases that existing tag,
# such as v0.1.0, which was pushed before this workflow existed; it runs only
# from main or a v* tag, and the `version` job refuses any other branch,
# because the jobs that release hold the run's OIDC token. A manual run
# without a tag, and a pull request that changes this file, build the
# archives and the tarballs and release nothing. A pull request that changes
# the packages or their scripts runs it too, so the install check runs before
# a release needs it.
#
# The `publish` job publishes the two packages to npmjs and attaches their
# tarballs to the release, and it runs only when the repository variable
# NPM_PUBLISH is `true`. Until the owner sets it, a release attaches the
# binary archives alone and publishes nothing. Before setting it, npmjs must
# hold each package once, published by hand, with this workflow set as its
# trusted publisher, and must hold the version of @crumbkit/ui that ui/ pins
# (docs/packages.md). Publishing uses npm trusted publishing, so the workflow
# holds no npm token. The binary release never waits on publishing.
#
# No job uses rust-cache, because a poisoned cache would reach the released
# binaries, and zizmor fails a release workflow that restores a cache.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - ui/headless/**
      - ui/react/**
      - ui/pnpm-lock.yaml
      - scripts/pack-packages/**
      - scripts/check-packages/**
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release, such as v0.1.0. Leave it empty to build without releasing.
        type: string
        default: ""

# Each job grants only the permissions it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

# Every step's script is bash, which the Windows runners have too.
defaults:
  run:
    shell: bash

jobs:
  # The tag to release, if any, the version that Cargo.toml holds at it, and
  # whether the run publishes the packages.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout reads the repository.
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      # A run that releases starts from main or a v* tag, so a workflow file
      # on an unreviewed branch never gets the release jobs' OIDC token.
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$INPUT_TAG
          fi
          case "$tag" in
            "") ref= ;;
            v[0-9]*) ref=refs/tags/$tag ;;
            *) echo "the tag is $tag, and a release tag starts with v and a digit" >&2; exit 1 ;;
          esac
          if [ -n "$tag" ]; then
            case "$GITHUB_REF" in
              refs/heads/main | refs/tags/v*) ;;
              *) echo "the run is on $GITHUB_REF, and a release runs from main or a v* tag" >&2; exit 1 ;;
            esac
          fi
          if [ -n "$tag" ] && [ "$NPM_PUBLISH" = true ]; then
            publish=true
          else
            publish=false
          fi
          {
            echo "tag=$tag"
            echo "ref=$ref"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.ref }}
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(cargo pkgid --package crumbkit-flightdeck | sed 's/.*[#@]//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "the tag is $TAG and Cargo.toml says $version" >&2
            exit 1
          fi

  # BASE-29 and the TypeScript standards' BASE-17: the release and the npm
  # publish wait for both advisory checks, so neither the binaries, which
  # embed ui/, nor the packages ship a dependency with a known security
  # advisory.
  advisories:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: advisories
        run: cargo deny --locked check advisories
      # pnpm audit reads ui's lockfile, which covers the page, headless and
      # react, asks the npm registry for advisories against every package in
      # it, and fails on any advisory that pnpm-workspace.yaml does not list
      # in auditConfig.ignoreGhsas. pnpm/action-setup installs the pnpm that
      # `packageManager` names, and setup-node the Node that .node-version
      # names, with no cache.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          package-manager-cache: false
      - name: page advisories
        working-directory: ui
        run: pnpm audit

  # The tests on Linux, macOS and Windows, because the pull-request lane runs
  # every test on Linux and the Unix-only tests on no other system, and
  # flightdeck's process handling differs between the three.
  tests:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      # shelf and reading at the commit that the install script pins.
      - name: test tools
        run: scripts/install-test-tools.sh
      # Every test, including the binaries that `default-filter` in
      # .config/nextest.toml leaves out.
      - name: tests
        run: cargo nextest run --locked --workspace --all-features --ignore-default-filter

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            exe: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # actions/checkout reads the repository.
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      # rustup installs the toolchain that rust-toolchain.toml pins.
      - run: rustup target add "$TARGET"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-auditable@0.7.7
          fallback: none
      # BASE-30: the binary records the dependency versions it contains.
      - run: cargo auditable build --release --locked --package crumbkit-flightdeck --target "$TARGET"
      - name: version
        run: |
          printed=$("target/$TARGET/release/flightdeck$EXE" --version)
          if [ "$printed" != "flightdeck $VERSION" ]; then
            echo "the binary printed '$printed', and the release is $VERSION" >&2
            exit 1
          fi
      # A Windows binary goes in a zip archive, which Windows opens itself.
      - run: |
          mkdir dist
          if [ -n "$EXE" ]; then
            7z a "dist/flightdeck-$VERSION-$TARGET.zip" "./target/$TARGET/release/flightdeck$EXE"
          else
            tar -C "target/$TARGET/release" -czf "dist/flightdeck-$VERSION-$TARGET.tar.gz" flightdeck
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flightdeck-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The two package tarballs at the release's version, and the check that a
  # project with pnpm's default settings installs and renders them. For a
  # run that publishes, pack.sh stops unless npmjs holds the version of
  # @crumbkit/ui that ui/ pins, with the same dist/ as its tag; any other run
  # only warns.
  packages:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout reads the repository.
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REGISTRY: ${{ needs.version.outputs.publish == 'true' && 'require' || 'warn' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      # pnpm/action-setup installs the pnpm that `packageManager` names, and
      # setup-node the Node that .node-version names, with no cache.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          package-manager-cache: false
      - name: install
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: pack
        run: scripts/pack-packages/pack.sh "$VERSION" packages --registry "$REGISTRY"
      - name: install check
        run: scripts/check-packages/check.sh "$VERSION" packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/*.tgz
          if-no-files-found: error

  # The release gets the binary archives and SHA256SUMS, each with a build
  # provenance attestation. A refused attestation uploads nothing. A run
  # again after a failure replaces the files of a release that the failed
  # run created. It waits for no npm step.
  release:
    if: needs.version.outputs.tag != ''
    needs: [version, advisories, tests, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # gh creates the release and uploads its files.
      id-token: write # attest-build-provenance signs with the run's OIDC token.
      attestations: write # attest-build-provenance stores the attestations.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flightdeck-*
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes dist/*
          fi

  # Only when the repository variable NPM_PUBLISH is `true`: npmjs gets the
  # two packages, and the release gets their tarballs, listed in its
  # SHA256SUMS, each with a build provenance attestation. The steps run in
  # that order, so a refused attestation publishes nothing and a refused
  # publish of the core attaches nothing. A run again after a failure skips
  # a package version that npmjs already holds, because a published version
  # never changes. It names the advisory checks itself, so it waits for them
  # even if the release job stops waiting for them.
  publish:
    if: needs.version.outputs.publish == 'true'
    needs: [version, advisories, packages, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # gh downloads SHA256SUMS and uploads the tarballs.
      id-token: write # attest-build-provenance and npm trusted publishing sign with the run's OIDC token.
      attestations: write # attest-build-provenance stores the attestations.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      # The version job refuses this too; the check stays beside the token.
      - name: ref
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) ;;
            *) echo "the run is on $GITHUB_REF, and publishing runs from main or a v* tag" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      # The release's SHA256SUMS, with the tarballs' lines in place of any
      # that an earlier run wrote.
      - run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          cd dist
          { grep -v ' crumbkit-flightdeck-' "$RUNNER_TEMP/SHA256SUMS" || true; sha256sum -- *.tgz; } > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # npm trusted publishing needs npm 11.5.1 or later, which the Node of
      # ui/.node-version ships, so the job checks out that one file. No
      # .npmrc names a token; npm exchanges the run's OIDC token for a
      # short-lived one. The core goes first, because the hooks name its
      # exact version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          path: source
          sparse-checkout: ui/.node-version
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/ui/.node-version
          package-manager-cache: false
      - name: publish
        run: |
          for package in headless react; do
            tarball=$(ls dist/crumbkit-flightdeck-$package-*.tgz)
            name=@crumbkit/flightdeck-$package
            version=$(tar -xzOf "$tarball" package/package.json | jq -r .version)
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "npmjs already holds $name $version"
            else
              npm publish "$tarball" --access public
            fi
          done
      - run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*

# flightdeck's adoption map of Luke Randall's Rust standards
# (https://github.com/crumbkit/rust-standards, adoption.md).

schema = "rust-standards/adoption/v1"
standards = { version = "0.1.0", commit = "7c9a7577fed4fe5ba0682960c0380af0a75dace4" }

# flightdeck is a command-line program built on crumbkit, it starts the tool
# it wraps as a child process, and it serves a local web page.
profiles = ["base", "cli", "child-process", "service"]

[[binding]]
rule = "PROC-1"
owners = ["src/spawn.rs", "src/spawn/browser.rs", "src/spawn/stream.rs", "src/spawn/stream/follower.rs", "src/spawn/stream/readers.rs"]
checks = [
  "clippy disallowed_methods and disallowed_types (clippy.toml)",
  "the argument vector test in src/spawn/tests.rs",
  "the vector tests in src/runner/vector/tests.rs",
  "the not-found, not-a-document, time-limit and background-process tests in tests/model.rs",
  "the argument and time-limit tests of the opener in src/spawn/browser/tests.rs",
  "the drain test in src/spawn/stream/drain/tests.rs",
  "the refusal, separator, cancel, spawn, other-session and other-group tests in tests/runner.rs",
  "the refusal, dash value, disconnect, write time and shutdown tests in tests/routes.rs",
  "the cancel test in tests/open.rs that starts flightdeck with SIGINT ignored",
  "the choices refusal and time tests in tests/routes.rs",
]
note = "spawn has three operations. spawn::describe runs one of the fixed queries of spawn::Query. spawn::stream runs a runner::Argv, which only the runner builds after it checks the command and each value against the tool's model. On Unix both kill the child's whole process group when the child exits, before they reap the child. describe also kills the group when its time limit passes, and stream also stops the group when a run is cancelled, dropped or past an output limit. stream also signals the child itself when it has moved to another group. A descendant that leaves the group, such as one that calls setsid, is not stopped. When it holds a pipe open, describe's reads end at its deadline, and stream's reads end spawn::DRAIN_GRACE after the child is reaped. spawn::open_browser runs the system's opener with the opener page's path as its one argument, and at its time limit stops the opener alone, never the browser it starts. Each module's documentation states the five items of PROC-2. A child inherits the embedding process's signal dispositions, so when that process ignores SIGINT, a cancel of a child that relies on SIGINT's default action escalates to SIGTERM or SIGKILL; `flightdeck open` installs SIGINT and SIGTERM handlers before it serves, so its children start with SIGINT at its default."

[[binding]]
rule = "SVC-1"
owners = ["src/spawn.rs", "src/spawn/stream.rs", "src/spawn/stream/follower.rs", "src/spawn/stream/readers.rs", "src/server.rs"]
checks = ["clippy disallowed_methods (clippy.toml)", "the shutdown and stopped-reading tests in tests/runner.rs"]
note = "flightdeck's own threads are the two pipe readers of spawn::describe and, on Unix, the thread that waits for the child to exit, and a std::thread::scope joins all three before describe returns. Each run of spawn::stream has one thread, which runner::Runs owns and joins once the run has ended or at shutdown, which dropping the runner also starts, and that thread joins its pipe readers and exit waiter in a scope of its own (src/spawn/stream/follower.rs and readers.rs). Server::run opens a std::thread::scope that holds the server's accept thread and one thread for each open connection, at most server::CONNECTION_LIMIT. When the server stops, run wakes the accept thread with a connection to itself that gives up after one poll, joins it, shuts the runner down, gives every stream one write time in all for its last lines, then shuts down the reading half of every open connection, so a thread that waits for a request ends at its next read while a stream can still write its ended line, and the scope joins every thread before run returns. signal-hook starts no thread, because flightdeck registers only flags."

[[binding]]
rule = "BASE-24"
owners = ["src/server/secret.rs"]
checks = ["review: expose_secret appears only in the files below"]
note = "The launch code and the token are secrecy::SecretString values inside server::secret::Secret, and the launch code that the page sends is read straight into one. expose_secret is called in src/server/secret.rs to compare a presented value, in src/server/session.rs to compare a presented launch code, in src/server.rs to write the token reply, and in src/opener.rs to write the opener page."

[[binding]]
rule = "SVC-4"
owners = ["src/server/reply.rs", "src/server/document.rs"]
checks = [
  "the test in src/server/reply/tests.rs that lists every code and status",
  "the schema tests in src/server/document/tests.rs",
  "the refusal tests in tests/server.rs and tests/routes.rs",
]
note = "flightdeck owns its error format. A refusal of the request itself, including a body that times out with 408, is an RFC 9457 problem document with type about:blank, a title, the status and flightdeck's stable code. A failure of the runner carries a flightdeck/failure/v1 document in the shape of crumbkit's failure document, with the runner's stable code and its fields, and the status of server::failure_status: 422 for a request the runner refuses, 404 for a cancel that finds no run, 503 for a full or stopping runner, 500 for a tool that will not start or no random bytes, 502 for a choices source that ends without a listing, and 504 for one that outlasts the choices time."

[[binding]]
rule = "SVC-5"
owners = ["src/server.rs", "src/open.rs"]
checks = ["open_prints_two_lines_and_no_secret_and_stops_on_sigterm_with_exit_0 in tests/open.rs"]
note = "flightdeck writes no request log. The test searches everything flightdeck prints and every refusal for the token and the launch code."

[[binding]]
rule = "SVC-2"
owners = ["src/runner/runs.rs", "src/spawn/stream.rs", "src/server.rs", "src/server/stream.rs"]
checks = [
  "the shutdown, closed and cancel-during-shutdown tests in tests/runner.rs",
  "stopping_the_server_cancels_a_run_that_outlasts_the_shutdown_grace_and_ends_its_stream in tests/routes.rs",
  "sigterm_during_a_streamed_run_lets_the_run_finish_and_its_stream_end_before_flightdeck_exits in tests/open.rs",
]
note = "On Ctrl-C, SIGTERM or the idle limit, Server::run stops accepting and calls runner::Runner::shutdown before its scope joins the connection threads. runner::Runner::shutdown marks the runner closed, so every new run is refused with flightdeck::run::closed, and a run that was starting is stopped. spawn::wait_ended then lets the runs end by themselves until the shutdown grace of the settings passes, while each stays where a cancel finds it. The shutdown then cancels the runs that are left and joins every run. A cancelled run ends within the graces of its escalation and spawn::DRAIN_GRACE, because once it is stopped the reader of a full queue drops lines instead of waiting for the caller."

[[decision]]
id = "readiness"
requirement = "The page's server has no readiness endpoint, so SVC-6 has nothing to bind. The server answers once Server::new has returned, and it needs no store."
reason = "flightdeck serves one browser tab on the machine of the person who started it. No orchestrator or load balancer polls it, and the tool it runs is a child process that each run starts afresh."
realizations = ["src/server.rs"]

[[decision]]
id = "logging"
requirement = "flightdeck writes no log, so SVC-9 has nothing to bind. `flightdeck open` prints two status lines to standard error, and every other output is a reply to the page."
reason = "A log of a local server for one person would hold the commands that person ran and nothing an operator reads. Writing none also keeps the token, the launch code and the tool's output out of any file. The service profile's logging rule applies when flightdeck gains a log."
realizations = ["src/open.rs", "src/server.rs"]

[[binding]]
rule = "BASE-5"
owners = ["src/runner/clock.rs", "src/server.rs"]
checks = ["the expiry test in tests/runner.rs", "the idle-limit tests in tests/server.rs"]
note = "The runner reads the time only through a runner::Clock, and runner::SystemClock reads Instant::now. The server reads the time only through a server::Clock, and server::SystemClock reads Instant::now and SystemTime::now. The two stay separate because the runner needs only the monotonic clock. The tests pass a clock that they move forward."

[[binding]]
rule = "BASE-50"
owners = ["src/lock.rs"]
checks = ["review"]
note = "The functions of src/lock.rs take and wait on every lock of flightdeck. They recover a poisoned lock, because each change to the confirmation ids, to the list of runs, to the queue of a run's lines and to the server's map of open connections is one insert, removal, replacement or flag, and each method of server::Session keeps the session whole."

[[decision]]
id = "lanes"
requirement = """
- Lane: `gate` in .github/workflows/ci.yml, on each pull request and each push to main, on ubuntu-latest. It runs every step of the pull-request lane except `rustdoc` and `features`, because flightdeck does not adopt the library profile. Before the tests it installs shelf and reading from crumbkit with scripts/install-test-tools.sh, unless the cache holds them. After the Rust steps it runs the page's lane in ui/, which ui/typescript-standards.toml describes. Its budget is twenty minutes, the job's timeout, for both lanes together. A merge waits for it, and it is the one check that branch protection requires.
- Lane: `macos` in .github/workflows/ci.yml, weekly on Monday at 05:17 UTC. It runs the tests on macos-latest. Nothing waits for it.
- Lane: `advisories` in .github/workflows/ci.yml, daily at 06:43 UTC and on each push to main. Nothing waits for it.
- Lane: release in .github/workflows/release.yml, on each push of a `v*` tag. It runs the tests on ubuntu-24.04 and macos-15 and `advisories` (BASE-29), builds `flightdeck` with `cargo auditable` (BASE-30) for aarch64-apple-darwin, aarch64-unknown-linux-gnu and x86_64-unknown-linux-gnu, and attaches the archives and SHA256SUMS to the tag's GitHub release, which waits for the tests, the advisories and the builds. A pull request that changes the file runs the same jobs and releases nothing.
"""
reason = "The pull-request lane stays on one runner. The weekly macOS run catches a difference in process handling between Linux and macOS; finding it after merge is safe because the release lane runs the tests on both systems before it releases. The daily advisory run catches an advisory published against a dependency already on main, and finding it after merge is safe because nothing is released before it passes."
realizations = [".github/workflows/ci.yml", "scripts/install-test-tools.sh"]

[[decision]]
id = "release-profile"
requirement = "`[profile.release]` sets `overflow-checks = true`, `lto = false`, `codegen-units = 16` and `strip = \"none\"`."
reason = "People install flightdeck with `cargo install`, which builds it on their machine, so a fast release build is worth more than a smaller binary. These are Cargo's defaults, written out."
realizations = ["Cargo.toml"]

[[decision]]
id = "environment"
requirement = "flightdeck reads no environment variable of its own, so its BASE-28 catalog is empty and clippy.toml forbids every reader. crumbkit reads its own variables, such as FLIGHTDECK_OUTPUT_BUDGET, and its documentation catalogs them. A child process inherits flightdeck's environment, plus the variables that spawn::Program::env adds. The server keeps its token out of that environment, so the runner removes no variable before a run."
reason = "BASE-28's catalog test compares the catalog with the environment snapshot of BASE-6. With no variable read, there is no snapshot to compare, and the disallowed methods keep it that way until a variable is added with its catalog."
realizations = ["clippy.toml", "src/spawn.rs"]

[[exception]]
rule = "CLI-7"
paths = ["src/lib.rs"]
owner = "Luke Randall"
reason = "flightdeck keeps no usage log yet, and the pull request that added `flightdeck open` left it out to keep that change to the server and its sign-in."
correction = "Start crumbkit-usage in main and mount `self usage` before flightdeck's first release."

[[exception]]
rule = "CLI-1"
paths = ["src/open.rs"]
owner = "Luke Randall"
reason = "crumbkit's Output prints only documents and failures, and `flightdeck open` prints two status lines while it serves. src/open.rs writes them to standard error, which it opens in one place."
correction = "Write the lines through crumbkit's sink when crumbkit offers a writer for messages about a run."

[[decision]]
id = "open-exit"
requirement = "`flightdeck open` exits with 0 when Ctrl-C, SIGTERM or the idle limit stops the server, and removes the opener page's directory first. A second Ctrl-C or SIGTERM while it stops ends the process at once with exit code 130. tests/open.rs tests Ctrl-C and SIGTERM, and tests/streams.rs tests a closed standard output."
reason = "CLI-8 asks for exit code 130 on Ctrl-C because Ctrl-C usually interrupts a command before it has done its work. For `flightdeck open`, Ctrl-C is the normal way to finish, so the run succeeded. The forced exit keeps 130 because it interrupts the stop."
realizations = ["src/open.rs", "tests/open.rs", "tests/streams.rs"]
